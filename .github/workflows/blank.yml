name: Generate Bundle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate bundle catalog
        run: python "generate bundel"

      - name: Upload generated catalog
        uses: actions/upload-artifact@v4
        with:
          name: boulstudio-halloween-bundle
          path: boulstudio_halloween_bundle/
